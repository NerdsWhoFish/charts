# Default values for the dusk chart.

image:
  repository: ghcr.io/nerdswhofish/dusk
  # Empty means the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Stays 1: SQLite on one PVC, single writer. A second replica corrupts the
# index. Scaling out is a Dusk design change, not a values change.
replicaCount: 1
# Recreate, not RollingUpdate: two pods must never hold the same PVC.
# Costs a brief gap on every upgrade.
strategy:
  type: Recreate
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  annotations: {}
  # Defaults to the fullname template, or "default" when create is false.
  name: ""
  automountServiceAccountToken: false
dusk:
  # DUSK_PRIVATE_HOST, required. Where people reach the UI and where GitHub
  # returns the browser during setup. Host only, no path.
  # Must be how the outside world reaches Dusk, not the Service name:
  # GitHub redirects here after the App manifest flow and posts to /webhooks.
  privateHost: ""
  # DUSK_PUBLIC_HOST. Where GitHub delivers webhooks, when that differs from
  # privateHost. Set it when a public forwarder exposes only /webhooks while
  # the UI stays on a private hostname. Defaults to privateHost.
  publicHost: ""
  # DUSK_ADDR. The service and probe ports follow this port.
  addr: ":8080"
  # DUSK_DATA_DIR, the PVC mount point.
  # Holds the SQLite index plus the App private key and webhook secret.
  dataDir: /var/lib/dusk
# Appended after the DUSK_* vars, so these win. Standard EnvVar entries.
env: []
# - name: DUSK_LOG_LEVEL
#   value: debug

envFrom: []
# - secretRef:
#     name: dusk-extra

persistence:
  # Off means emptyDir: every restart forces re-onboarding. Trials only.
  enabled: true
  # Bind an existing PVC. Needed when restoring, since the chart's PVC has no
  # resource-policy keep annotation and an uninstall deletes it.
  existingClaim: ""
  # Empty uses the default StorageClass; "-" disables provisioning.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  annotations: {}
service:
  type: ClusterIP
  port: 80
  annotations: {}
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: dusk.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: dusk-tls
  #   hosts:
  #     - dusk.local
# Empty so the chart installs under tight quotas. Set requests for real use.
resources: {}
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # Chowns the volume so a non-root Dusk can write the data dir.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
# readyz gates traffic; healthz is lenient so a slow reconcile is not a restart.
livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6
readinessProbe:
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
# Only bounds in-flight webhook deliveries; Recreate already stopped the pod.
terminationGracePeriodSeconds: 30
# Merged with the data volume and the writable /tmp that readOnlyRootFilesystem
# makes necessary.
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
